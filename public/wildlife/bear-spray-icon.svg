<svg viewBox="0 0 440 470" width="440" height="470" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
.mover{transform-origin:170px 395px;animation:tilt 4s ease-in-out infinite;}
.can{transform-origin:170px 395px;animation:press 4s ease-in-out infinite;}
.lines{transform-origin:122px 84px;opacity:0;animation:lines 4s ease-out infinite;}
.cloud{transform-origin:122px 84px;opacity:0;animation:cloud 4s ease-out infinite;}
.puff{opacity:0;animation:puff 4s ease-out infinite;}
.p2{animation-delay:.08s} .p3{animation-delay:.16s}
@keyframes tilt{
 0%{transform:rotate(0)}
 25%,50%{transform:rotate(12deg)}
 75%,100%{transform:rotate(-3deg)}
}
@keyframes press{
 0%,25%{transform:rotate(0)} 27%{transform:rotate(-3deg) scaleY(.96)} 31%{transform:rotate(1deg) scaleY(1)}
 35%,75%{transform:rotate(0)} 77%{transform:rotate(-3deg) scaleY(.96)} 81%{transform:rotate(1deg) scaleY(1)}
 85%,100%{transform:rotate(0)}
}
@keyframes lines{
 0%,26%{opacity:0;transform:scale(.1)}
 29%{opacity:1;transform:scale(1.08)}
 38%{opacity:1;transform:scale(1)}
 45%,76%{opacity:0;transform:scale(1.15)}
 79%{opacity:1;transform:scale(1.08)}
 88%{opacity:1;transform:scale(1)}
 95%,100%{opacity:0;transform:scale(1.15)}
}
@keyframes cloud{
 0%,27%{opacity:0;transform:scale(.15)}
 32%{opacity:1;transform:scale(1.05)}
 40%{opacity:1;transform:scale(1)}
 49%,77%{opacity:0;transform:translate(14px,-10px) scale(1.25)}
 82%{opacity:1;transform:scale(1.05)}
 90%{opacity:1;transform:scale(1)}
 99%,100%{opacity:0;transform:translate(14px,-10px) scale(1.25)}
}
@keyframes puff{
 0%,29%{opacity:0;transform:translate(0,0) scale(.3)}
 33%{opacity:.9}
 48%,79%{opacity:0;transform:translate(70px,-40px) scale(1.3)}
 83%{opacity:.9;transform:translate(10px,-5px) scale(.5)}
 98%,100%{opacity:0;transform:translate(70px,-40px) scale(1.3)}
}
@media (prefers-reduced-motion:reduce){.mover,.can,.lines,.cloud,.puff{animation:none}.lines,.cloud{opacity:1}}
</style>
